apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: matrixdb-operator
  name: matrixdb-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrixdb-operator-controller-manager
  namespace: matrixdb-operator-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: matrixdb-operator
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-logs-container: manager
      labels:
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - /manager
        args:
        - --leader-elect=false
        - --health-probe-bind-address=:8081
        image: matrixdb-operator:v3.0.0
        imagePullPolicy: IfNotPresent
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: backup-dir
          mountPath: /tmp/matrixdb-backups
      volumes:
      - name: backup-dir
        hostPath:
          path: /tmp/matrixdb-backups
          type: DirectoryOrCreate
      serviceAccountName: matrixdb-operator-controller-manager
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: matrixdb-operator-webhook-service
  namespace: matrixdb-operator-system
  labels:
    app.kubernetes.io/name: matrixdb-operator
spec:
  ports:
  - port: 9443
    targetPort: 9443
    name: webhook
  selector:
    control-plane: controller-manager
