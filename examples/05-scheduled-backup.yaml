apiVersion: apps.matrixdb.io/v1alpha1
kind: MatrixDBScheduledBackup
metadata:
  name: scheduled-backup-daily
  namespace: default
spec:
  clusterName: matrixdb-prod
  schedule: 0 2 * * *
  retentionDays: 30
  storage:
    s3Endpoint: http://minio.default.svc:9000
    s3Bucket: matrixdb-backups
    s3AccessKey: minioadmin
    s3SecretKey: minioadmin
